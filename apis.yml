name: Prodigy Finance
description: Prodigy Finance is a fintech lender providing collateral-free, no-cosigner
  postgraduate education loans to international master's students at top business, engineering,
  and STEM schools worldwide. Founded in 2007 and headquartered in London, it uses a
  borderless, forward-looking credit model based on a borrower's projected future earnings
  rather than local credit history, funding students from more than 150 countries. Prodigy
  Finance operates consumer web and mobile (iOS/Android) applications, an accounts portal,
  and a customer help center, but publishes no public developer API, SDKs, or developer
  portal at this time.
